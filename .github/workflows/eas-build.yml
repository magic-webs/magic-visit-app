name: EAS Build (per tenant)

# GitHub's runs API doesn't expose workflow_dispatch input values anywhere
# filterable, EXCEPT via this run-name, which becomes each run's
# `display_title` — magic-visit-panel's Export page reads that to show only
# the runs that were actually for the tenant you're looking at (see
# app/api/tenants/[tenantId]/export/runs/route.ts). Keep this in sync with
# that route's parsing if you change the format.
run-name: "${{ inputs.tenant_slug }} — ${{ inputs.platform }}/${{ inputs.profile }}"

# Triggered either manually (Actions tab -> Run workflow) or by
# magic-visit-panel's "Create APK" button, which dispatches this same event
# via the GitHub REST API (see magic-visit-panel/app/api/tenants/[tenantId]/build/route.ts).
on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: "organizations.slug of the tenant to build (e.g. magic-visits)"
        required: true
      platform:
        description: "Target platform"
        required: true
        default: "android"
        type: choice
        options: [android, ios, all]
      profile:
        description: "eas.json build profile"
        required: true
        default: "preview"
        type: choice
        options: [preview, production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install eas-cli
        run: bun add -g eas-cli

      - name: Write base .env
        # EXPO_PUBLIC_* vars get inlined into the JS bundle at build time —
        # they need to exist here (not just in process.env) because that's
        # what Expo's own env-loading reads when `eas build` evaluates
        # app.config.js on its remote build machine, and `.env` isn't
        # excluded by .easignore, so it travels with the uploaded project
        # archive. EAS_PROJECT_ID isn't EXPO_PUBLIC_-prefixed (it's build
        # config, never shipped in the JS bundle) but rides along the same
        # way for app.config.js's own `extra.eas` field — set once under
        # Settings > Secrets and variables > Actions, either the Variables
        # or Secrets tab (checks both below, since it isn't sensitive but
        # it's easy to add it under the wrong one). `eas init` can create a
        # fresh EAS project, but hard-errors trying to write the id back
        # into a dynamic app.config.js, so that has to be a one-time manual
        # step (`eas init` locally, or use the project this workflow
        # already created at
        # https://expo.dev/accounts/magicwebsdeveloper/projects/urmil-jewellers-ramnagar)
        # — not something re-derived on every CI run.
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_INSTANT_APP_ID=${{ secrets.INSTANT_APP_ID }}
          EXPO_PUBLIC_AUTH_BRIDGE_URL=${{ secrets.AUTH_BRIDGE_URL }}
          EXPO_PUBLIC_TENANT_SLUG=${{ inputs.tenant_slug }}
          EAS_PROJECT_ID=${{ vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}
          EOF
          if [ -z "${{ vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}" ]; then
            echo "::error::EAS_PROJECT_ID isn't set as a repo Variable or Secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Sync tenant branding (APP_NAME / NOTIFICATION_COLOR)
        run: node scripts/sync-tenant-branding.js
        env:
          EXPO_PUBLIC_AUTH_BRIDGE_URL: ${{ secrets.AUTH_BRIDGE_URL }}
          EXPO_PUBLIC_TENANT_SLUG: ${{ inputs.tenant_slug }}

      - name: Build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
